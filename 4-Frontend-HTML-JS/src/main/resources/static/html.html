<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Management</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f4f4f4;
        }

        h1 {
            text-align: center;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        input {
            padding: 10px;
            margin: 5px;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
        }

        table {
            width: 100%;
            margin-top: 25px;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #eee;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Product Management</h1>

    <h2>Add Product</h2>

    <input
            type="text"
            id="productName"
            placeholder="Product Name">

    <input
            type="number"
            id="productPrice"
            placeholder="Price">

    <button onclick="addProduct()">
        Add Product
    </button>

    <h2>Products</h2>

    <button onclick="loadProducts()">
        Refresh Products
    </button>

    <table>

        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Price</th>
        </tr>
        </thead>

        <tbody id="productTableBody">

        </tbody>

    </table>

</div>

<script src="script.js"></script>

</body>

</html>
